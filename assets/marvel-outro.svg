<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 160" width="100%" height="160">
  <defs>
    <!-- Reveal Line 1 starting from x=0 to avoid clipping the leading 'N' -->
    <clipPath id="reveal-line-1">
      <rect x="0" y="15" width="0" height="60">
        <animate attributeName="width" from="0" to="750" begin="0.5s" dur="1.7s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>

    <!-- Reveal Line 2 starting from x=0 to avoid clipping -->
    <clipPath id="reveal-line-2">
      <rect x="0" y="75" width="0" height="70">
        <animate attributeName="width" from="0" to="750" begin="3.1s" dur="1.3s" fill="freeze" calcMode="linear" />
      </rect>
    </clipPath>
  </defs>

  <!-- Pitch Black Cinematic Background -->
  <rect width="100%" height="100%" rx="8" fill="#000000" />

  <!-- SEQUENCE 1: Line 1 + Red Laser Strikeout -->
  <g>
    <!-- Dims Line 1 after laser strike -->
    <animate attributeName="opacity" from="1" to="0.3" begin="2.7s" dur="0.3s" fill="freeze" />

    <!-- Line 1 Text -->
    <text x="375" y="50" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="15" 
          font-weight="600" 
          letter-spacing="4" 
          text-anchor="middle" 
          clip-path="url(#reveal-line-1)">
      NN DIY SPIRIT WILL RETURN IN DOOMSDAY
    </text>

    <!-- Glowing Red Laser Outer Aura (starts slightly before the N and ends past DOOMSDAY) -->
    <line x1="100" y1="45" x2="100" y2="45" stroke="#FF0033" stroke-width="7" stroke-opacity="0.45" stroke-linecap="round">
      <animate attributeName="x2" from="100" to="650" begin="2.3s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </line>

    <!-- Sharp Red Laser Core -->
    <line x1="100" y1="45" x2="100" y2="45" stroke="#FF2B2B" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" from="100" to="650" begin="2.3s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </line>
  </g>

  <!-- SEQUENCE 2: Line 2 Types Out Below -->
  <g clip-path="url(#reveal-line-2)">
    <!-- Soft Glow Under-layer -->
    <text x="375" y="114" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-opacity="0.4"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle">
      NN DIY SPIRIT WILL RETURN
    </text>

    <!-- Crisp Bright Core Text -->
    <text x="375" y="114" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="25" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle">
      NN DIY SPIRIT WILL RETURN
    </text>
  </g>
</svg>
