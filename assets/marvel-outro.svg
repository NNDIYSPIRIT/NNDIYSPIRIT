<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 140" width="100%" height="140">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&amp;display=swap');

      .scene-text {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        text-anchor: middle;
        letter-spacing: 4px;
      }

      /* 1. Types Line 1 */
      .type-line-1 {
        font-size: 16px;
        font-weight: 500;
        fill: #94A3B8;
        clip-path: inset(0 100% 0 0);
        animation: typeText 1.8s steps(38, end) 0.5s forwards;
      }

      /* 2. Red laser slices through */
      .strike-laser {
        stroke: #EF4444;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 470;
        stroke-dashoffset: 470;
        filter: url(#neon-glow);
        animation: strikeOut 0.4s ease-in-out 2.8s forwards;
      }

      /* Dims line 1 after being struck */
      .line-1-container {
        animation: dimLine 0.4s ease 3.2s forwards;
      }

      /* 3. Bold line slams in bigger below */
      .type-line-2 {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 6px;
        fill: #00E5FF;
        filter: url(#neon-glow);
        opacity: 0;
        transform-origin: center 100px;
        animation: slamIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 3.5s forwards;
      }

      @keyframes typeText {
        to { clip-path: inset(0 0 0 0); }
      }

      @keyframes strikeOut {
        to { stroke-dashoffset: 0; }
      }

      @keyframes dimLine {
        to { opacity: 0.35; }
      }

      @keyframes slamIn {
        0% {
          opacity: 0;
          transform: scale(1.2);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </defs>

  <!-- Step 1 & 2: Top Line + Laser Strike -->
  <g class="line-1-container">
    <text x="375" y="45" class="scene-text type-line-1">
      NN DIY SPIRIT WILL RETURN IN DOOMSDAY
    </text>
    <line x1="140" y1="40" x2="610" y2="40" class="strike-laser" />
  </g>

  <!-- Step 3: Bigger Bottom Line -->
  <text x="375" y="105" class="scene-text type-line-2">
    NN DIY SPIRIT WILL RETURN
  </text>
</svg>
